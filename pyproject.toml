[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universo-mobius"
version = "0.1.0"
description = "OCTH Signal Processing Suite - Audio cleaning based on gravitational wave algorithms"
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "Francisco Molina Burgos"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
keywords = ["audio", "noise-reduction", "spectral-analysis", "OCTH"]

dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "scipy>=1.7.0",
    "soundfile>=0.10.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
]
visualization = [
    "plotly>=5.10.0",
    "dash>=2.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
full = [
    "universo-mobius[api,visualization]",
]

[project.scripts]
vms-clean = "vms_engine.cleaner:main"
vms-discriminator = "discriminator_3d.app:run_discriminator"

[project.urls]
Homepage = "https://github.com/yatrogenesis/universo-mobius"
Documentation = "https://github.com/yatrogenesis/universo-mobius#readme"
Repository = "https://github.com/yatrogenesis/universo-mobius"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
