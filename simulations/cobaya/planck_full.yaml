# Cobaya MCMC configuration for MÖBIUS validation
# Author: Francisco Molina-Burgos
# January 2026

# This configuration runs MCMC with Planck 2018 likelihoods
# using classy as the theory code.

likelihood:
  planck_2018_lowl.TT:
  planck_2018_highl_plik.TTTEEE_lite:

theory:
  classy:
    extra_args:
      non_linear: halofit

params:
  # Baseline cosmological parameters
  omega_b:
    prior:
      min: 0.019
      max: 0.025
    ref: 0.02237
    proposal: 0.0003
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior:
      min: 0.10
      max: 0.14
    ref: 0.1200
    proposal: 0.002
    latex: \Omega_\mathrm{c} h^2
  H0:
    prior:
      min: 60
      max: 80
    ref: 73.1
    proposal: 0.5
    latex: H_0
  tau_reio:
    prior:
      min: 0.01
      max: 0.10
    ref: 0.054
    proposal: 0.006
    latex: \tau_\mathrm{reio}
  logA:
    prior:
      min: 2.5
      max: 3.5
    ref: 3.044
    proposal: 0.01
    latex: \log(10^{10} A_\mathrm{s})
  n_s:
    prior:
      min: 0.9
      max: 1.1
    ref: 0.9649
    proposal: 0.004
    latex: n_\mathrm{s}
  A_planck:
    prior:
      min: 0.9
      max: 1.1
    ref: 1.0
    proposal: 0.002
    latex: A_\mathrm{Planck}

  # Derived parameters
  As:
    derived: "lambda logA: 1e-10*np.exp(logA)"
    latex: A_\mathrm{s}
  sigma8:
    latex: \sigma_8

sampler:
  mcmc:
    max_samples: 500
    Rminus1_stop: 0.1
    burn_in: 50
    learn_proposal: true
    output_every: 10s

output: chains/mobius_planck_full
