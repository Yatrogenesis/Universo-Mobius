# ============================================================================
# UNIVERSO-MOBIUS Docker Compose
# ============================================================================
# Development and production configurations

version: '3.8'

services:
  # Main API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - VMS_ENV=production
      - VMS_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # 3D Discriminator dashboard (optional)
  discriminator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8050:8050"
    command: ["python", "-m", "discriminator_3d.app"]
    volumes:
      - ./data:/app/data
    environment:
      - VMS_ENV=production
    depends_on:
      - api
    restart: unless-stopped

  # Redis cache (optional, for production scaling)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis_data:

# ============================================================================
# Usage:
#   Development: docker-compose up
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Rebuild:     docker-compose build --no-cache
# ============================================================================
